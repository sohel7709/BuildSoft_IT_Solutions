<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>BuildSoft</title>

    <!-- Favicon: SVG for modern browsers, ICO for legacy browsers -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />

    <!-- Apply preferred theme immediately to avoid FOUC -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) { /* ignore */ }
      })();
    </script>

    <style>
      /* Small UI niceties for better readability */
      html, body, #root { height: 100%; }
      body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    </style>
    <script type="module" crossorigin src="/assets/index-BjzlSqkG.js"></script>
  </head>
  <body class="antialiased bg-white dark:bg-slate-900 text-gray-900 dark:text-gray-100">
    <div id="root"></div>

    <!-- React bundle is a module so it is deferred by default; it will execute as soon as
         the DOM is parsed, independent of any blocking scripts below. -->

    <!-- Tailwind CDN loaded ASYNC so it never blocks React from rendering. The app will
         render with unstyled markup first, then Tailwind classes will apply once the CDN
         finishes loading. `defer` is also added to make ordering deterministic. -->
    <script>
      window.tailwind = window.tailwind || {};
      window.tailwind.config = { darkMode: 'class' };
    </script>
    <script defer src="https://cdn.tailwindcss.com"></script>

    <!-- Fallback theme toggle handler for non-react toggle issues -->
    <script>
      document.addEventListener('click', function (e) {
        var btn = e.target.closest && e.target.closest('[aria-label="Toggle Dark Mode"]');
        if (btn) {
          try {
            var isDark = document.documentElement.classList.contains('dark');
            if (isDark) {
              document.documentElement.classList.remove('dark');
              localStorage.setItem('theme', 'light');
            } else {
              document.documentElement.classList.add('dark');
              localStorage.setItem('theme', 'dark');
            }
          } catch (err) { /* noop */ }
        }
      });
    </script>
  </body>
</html>
